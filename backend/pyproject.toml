[tool.poetry]
name = "clendan-backend"
version = "0.1.0"
description = "Clendan AI Financial Agent OS — Backend"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = {extras = ["email"], version = "^2.7.0"}
pydantic-settings = "^2.2.0"
prisma = "^0.13.1"
anthropic = "^0.28.0"
httpx = "^0.27.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
sentry-sdk = {extras = ["fastapi"], version = "^2.3.0"}
redis = "^5.0.4"
arq = "^0.25.0"
cryptography = "^42.0.8"
pymupdf = "^1.24.0"
python-multipart = "^0.0.9"
posthog = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live PostgreSQL with RLS applied (deselect with -m 'not integration')",
]
