<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 1180" width="375" height="1180" font-family="'IBM Plex Mono', monospace" role="img" aria-label="Clendan Tools — AP-to-close workflow (mobile)">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Syne:wght@600;700;800&amp;display=swap');
      .syne{font-family:'Syne',sans-serif}
      .mono{font-family:'IBM Plex Mono',monospace}
      .ln{fill:none;stroke:#0d1117;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .lnm{fill:none;stroke:#5d6b7a;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
      .step{opacity:0;animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) forwards}
      .card{animation:bob 3.4s ease-in-out infinite}
      .conn{stroke:#cfd6df;stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round;animation:flow 1.6s ease-in-out infinite}
      @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
      @keyframes flow{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes glow{0%,100%{opacity:0}50%{opacity:.5}}
      .cta-glow{animation:glow 2.2s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce){.step{opacity:1;animation:none}.card,.conn,.cta-glow{animation:none}}
    </style>
  </defs>

  <rect width="375" height="1180" fill="#f5f5f5"/>

  <!-- header -->
  <text x="20" y="42" class="mono" font-size="9" letter-spacing="2.5" fill="#5d6b7a">WORKFLOW · AP → CLOSE</text>
  <text x="20" y="76" class="syne" font-size="24" font-weight="800" fill="#0d1117">From inbox to</text>
  <text x="20" y="104" class="syne" font-size="24" font-weight="800" fill="#0d1117">closed books.</text>
  <text x="20" y="130" class="mono" font-size="11" fill="#5d6b7a">Six steps. One click. AI runs your close.</text>

  <!-- Run Full Close (full width) -->
  <rect x="16" y="146" width="343" height="50" rx="6" fill="#00C853" class="cta-glow"/>
  <rect x="20" y="150" width="335" height="42" rx="5" fill="#00C853"/>
  <path d="M150 164 v14 l12 -7 Z" fill="#000000"/>
  <text x="170" y="176" class="syne" font-size="15" font-weight="700" fill="#000000">Run Full Close</text>

  <!-- vertical connectors (behind nodes) node cx=54, cy: 262,412,562,712,862,1012 r=24 -->
  <g>
    <line class="conn" x1="54" y1="288" x2="54" y2="386"/>
    <line class="conn" x1="54" y1="438" x2="54" y2="536" style="animation-delay:.2s"/>
    <line class="conn" x1="54" y1="588" x2="54" y2="686" style="animation-delay:.4s"/>
    <line class="conn" x1="54" y1="738" x2="54" y2="836" style="animation-delay:.6s"/>
    <line class="conn" x1="54" y1="888" x2="54" y2="986" style="animation-delay:.8s"/>
    <circle r="3.5" fill="#00C853"><animateMotion dur="2.2s" repeatCount="indefinite" path="M54 288 L54 386"/></circle>
    <circle r="3.5" fill="#00C853"><animateMotion dur="2.2s" begin=".4s" repeatCount="indefinite" path="M54 438 L54 536"/></circle>
    <circle r="3.5" fill="#f5a623"><animateMotion dur="2.2s" begin=".8s" repeatCount="indefinite" path="M54 588 L54 686"/></circle>
    <circle r="3.5" fill="#00C853"><animateMotion dur="2.2s" begin="1.2s" repeatCount="indefinite" path="M54 738 L54 836"/></circle>
    <circle r="3.5" fill="#00C853"><animateMotion dur="2.2s" begin="1.6s" repeatCount="indefinite" path="M54 888 L54 986"/></circle>
  </g>

  <!-- STEP 1 · Invoices Arrive -->
  <g class="step" style="animation-delay:.05s">
    <circle cx="54" cy="262" r="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(54,262)"><path class="ln" d="M-10 2 v4 q0 2 2 2 h16 q2 0 2 -2 v-4 h-5 l-1.5 3 h-7 l-1.5 -3 Z"/><path class="ln" d="M0 -9 v8 M-4 -4 l4 4 l4 -4"/></g>
    <rect x="92" y="216" width="263" height="94" rx="4" fill="#ffffff" stroke="#c9d1da" stroke-width="1.3" stroke-dasharray="4 4" class="card"/>
    <text x="108" y="240" class="syne" font-size="13" font-weight="700" fill="#0d1117">Invoices Arrive</text>
    <g class="mono" font-size="9" fill="#3d4754">
      <rect x="108" y="252" width="46" height="19" rx="4" fill="#f4f6fb" stroke="#e0e0e0"/><text x="131" y="265" text-anchor="middle">Gmail</text>
      <rect x="160" y="252" width="42" height="19" rx="4" fill="#f4f6fb" stroke="#e0e0e0"/><text x="181" y="265" text-anchor="middle">Drive</text>
      <rect x="208" y="252" width="52" height="19" rx="4" fill="#f4f6fb" stroke="#e0e0e0"/><text x="234" y="265" text-anchor="middle">Outlook</text>
    </g>
    <text x="108" y="292" class="mono" font-size="10" fill="#5d6b7a">Auto-ingested — no manual upload.</text>
  </g>

  <!-- STEP 2 · Clen Extracts Data -->
  <g class="step" style="animation-delay:.18s">
    <circle cx="54" cy="412" r="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(54,412)"><path class="ln" d="M-8 -11 h9 l6 5 v17 h-15 Z"/><path class="lnm" d="M-4 -2 h8 M-4 2 h8 M-4 6 h5"/><path d="M8 -9 l1.1 2.4 l2.4 1.1 l-2.4 1.1 l-1.1 2.4 l-1.1 -2.4 l-2.4 -1.1 l2.4 -1.1 Z" fill="#00C853"/></g>
    <g class="card" style="animation-delay:.1s">
      <rect x="92" y="366" width="263" height="94" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.3"/>
      <rect x="92" y="366" width="3" height="94" fill="#00C853"/>
      <text x="108" y="390" class="syne" font-size="13" font-weight="700" fill="#0d1117">Clen Extracts Data</text>
      <text x="108" y="408" class="syne" font-size="12" font-weight="700" fill="#3d4754">Document Intelligence</text>
      <text x="108" y="428" class="mono" font-size="10" fill="#5d6b7a">Reads every PDF — vendor, lines, totals.</text>
      <rect x="108" y="438" width="50" height="18" rx="9" fill="#F0FBF4" stroke="#cdefd9"/><circle cx="120" cy="447" r="3" fill="#00C853"/><text x="128" y="451" class="mono" font-size="9" fill="#00963c">Auto</text>
      <text x="339" y="451" text-anchor="end" class="mono" font-size="10" fill="#5d6b7a">Configure ▸</text>
    </g>
  </g>

  <!-- STEP 3 · Matched & Coded -->
  <g class="step" style="animation-delay:.31s">
    <circle cx="54" cy="562" r="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(54,562)"><path class="ln" d="M-10 -5 h8 v8 h-8 Z M2 -1 h8 v8 h-8 Z"/><circle cx="8" cy="7" r="5.5" fill="#fff" stroke="#00C853" stroke-width="1.5"/><path d="M5.5 7 l1.6 1.6 l3 -3.4" fill="none" stroke="#00C853" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="card" style="animation-delay:.2s">
      <rect x="92" y="516" width="263" height="94" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.3"/>
      <rect x="92" y="516" width="3" height="94" fill="#00C853"/>
      <text x="108" y="540" class="syne" font-size="13" font-weight="700" fill="#0d1117">Invoices Matched &amp; Coded</text>
      <text x="108" y="558" class="syne" font-size="12" font-weight="700" fill="#3d4754">Doc Intelligence · Tax Compliance</text>
      <text x="108" y="578" class="mono" font-size="10" fill="#5d6b7a">Matched to PO &amp; bill, coded to VAT.</text>
      <rect x="108" y="588" width="50" height="18" rx="9" fill="#F0FBF4" stroke="#cdefd9"/><circle cx="120" cy="597" r="3" fill="#00C853"/><text x="128" y="601" class="mono" font-size="9" fill="#00963c">Auto</text>
      <text x="339" y="601" text-anchor="end" class="mono" font-size="10" fill="#5d6b7a">Configure ▸</text>
    </g>
  </g>

  <!-- STEP 4 · Approvals & Payment (coming soon) -->
  <g class="step" style="animation-delay:.44s">
    <circle cx="54" cy="712" r="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(54,712)" opacity="0.9"><rect class="lnm" x="-10" y="-8" width="20" height="17" rx="2"/><path class="lnm" d="M-10 -3 h20 M-5 -11 v4 M5 -11 v4"/></g>
    <g class="card" style="animation-delay:.3s">
      <rect x="92" y="666" width="263" height="94" rx="4" fill="#fbfbfa" stroke="#ece7db" stroke-width="1.3"/>
      <text x="108" y="690" class="syne" font-size="13" font-weight="700" fill="#3d4754">Approvals &amp; Payment Scheduled</text>
      <text x="108" y="708" class="syne" font-size="12" font-weight="700" fill="#8a94a0">Payment Runs</text>
      <text x="108" y="728" class="mono" font-size="10" fill="#8a94a0">Auto-schedules approved payments.</text>
      <rect x="108" y="738" width="92" height="18" rx="9" fill="#FEF6E7" stroke="#f6e2b8"/><circle cx="120" cy="747" r="3" fill="#f5a623"/><text x="128" y="751" class="mono" font-size="9" fill="#b9791a">Coming soon</text>
      <text x="339" y="751" text-anchor="end" class="mono" font-size="10" fill="#b6bcc4">Notify me ▸</text>
    </g>
  </g>

  <!-- STEP 5 · Bank Rec Complete -->
  <g class="step" style="animation-delay:.57s">
    <circle cx="54" cy="862" r="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(54,862)"><path class="ln" d="M-11 -1 L0 -10 L11 -1 Z"/><path class="ln" d="M-11 9 h22"/><path class="lnm" d="M-7 0 v7 M-2 0 v7 M3 0 v7 M8 0 v7"/></g>
    <g class="card" style="animation-delay:.4s">
      <rect x="92" y="816" width="263" height="94" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.3"/>
      <rect x="92" y="816" width="3" height="94" fill="#00C853"/>
      <text x="108" y="840" class="syne" font-size="13" font-weight="700" fill="#0d1117">Bank Rec Complete</text>
      <text x="108" y="858" class="syne" font-size="12" font-weight="700" fill="#3d4754">Reconciliation</text>
      <text x="108" y="878" class="mono" font-size="10" fill="#5d6b7a">Matches txns, flags the rest. Bank·VAT·pay.</text>
      <rect x="108" y="888" width="50" height="18" rx="9" fill="#F0FBF4" stroke="#cdefd9"/><circle cx="120" cy="897" r="3" fill="#00C853"/><text x="128" y="901" class="mono" font-size="9" fill="#00963c">Auto</text>
      <text x="339" y="901" text-anchor="end" class="mono" font-size="10" fill="#5d6b7a">Configure ▸</text>
    </g>
  </g>

  <!-- STEP 6 · Books Closed -->
  <g class="step" style="animation-delay:.7s">
    <circle cx="54" cy="1012" r="24" fill="#ffffff" stroke="#00C853" stroke-width="1.6"/>
    <g transform="translate(54,1012)"><path class="ln" d="M-9 -10 h11 q3 0 3 3 v17 h-14 Z"/><path class="lnm" d="M-9 -10 v20"/><path d="M-2 0 l2 2.4 l4 -5" fill="none" stroke="#00C853" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="card" style="animation-delay:.5s">
      <rect x="92" y="966" width="263" height="94" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.3"/>
      <rect x="92" y="966" width="3" height="94" fill="#00C853"/>
      <text x="108" y="990" class="syne" font-size="13" font-weight="700" fill="#0d1117">Books Closed</text>
      <text x="108" y="1008" class="syne" font-size="12" font-weight="700" fill="#3d4754">Financial Reporting</text>
      <text x="108" y="1028" class="mono" font-size="10" fill="#5d6b7a">P&amp;L, balance sheet, cash flow + AI notes.</text>
      <rect x="108" y="1038" width="50" height="18" rx="9" fill="#F0FBF4" stroke="#cdefd9"/><circle cx="120" cy="1047" r="3" fill="#00C853"/><text x="128" y="1051" class="mono" font-size="9" fill="#00963c">Auto</text>
      <text x="339" y="1051" text-anchor="end" class="mono" font-size="10" fill="#5d6b7a">Configure ▸</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(20,1110)" class="mono" font-size="10" fill="#5d6b7a">
    <circle cx="5" cy="-4" r="3.5" fill="#00C853"/><text x="15" y="0">Auto</text>
    <circle cx="70" cy="-4" r="3.5" fill="#00a8cc"/><text x="80" y="0">Approval</text>
    <circle cx="165" cy="-4" r="3.5" fill="#f5a623"/><text x="175" y="0">Coming soon</text>
  </g>
</svg>
