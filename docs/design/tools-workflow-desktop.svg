<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="'IBM Plex Mono', monospace" role="img" aria-label="Clendan Tools — AP-to-close workflow (desktop)">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Syne:wght@600;700;800&amp;display=swap');
      .syne{font-family:'Syne',sans-serif}
      .mono{font-family:'IBM Plex Mono',monospace}
      .ln{fill:none;stroke:#0d1117;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .lnm{fill:none;stroke:#5d6b7a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .step{opacity:0;animation:fadeUp .55s cubic-bezier(.2,.7,.3,1) forwards}
      .card{animation:bob 3.2s ease-in-out infinite}
      .conn{stroke:#cfd6df;stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round;animation:flow 1.6s ease-in-out infinite}
      .dot{fill:#00C853}
      @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes flow{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes glow{0%,100%{opacity:0}50%{opacity:.55}}
      .cta-glow{animation:glow 2.2s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce){.step{opacity:1;animation:none}.card,.conn,.cta-glow{animation:none}}
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1440" height="900" fill="#f5f5f5"/>

  <!-- left rail -->
  <rect x="0" y="0" width="64" height="900" fill="#ffffff"/>
  <line x1="64" y1="0" x2="64" y2="900" stroke="#e0e0e0" stroke-width="1"/>
  <path d="M32 24 L44 30 V42 C44 50 38 56 32 58 C26 56 20 50 20 42 V30 Z" fill="none" stroke="#00C853" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M27 41 l4 4 l7 -8" fill="none" stroke="#00C853" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="0" y="150" width="3" height="26" rx="1.5" fill="#00C853"/>
  <rect x="23" y="120" width="18" height="14" rx="3" class="lnm"/>
  <rect x="23" y="154" width="18" height="14" rx="3" fill="none" stroke="#0d1117" stroke-width="1.6"/>
  <circle cx="32" cy="196" r="8" class="lnm"/>
  <rect x="24" y="230" width="16" height="16" rx="3" class="lnm"/>

  <!-- header -->
  <text x="96" y="52" class="mono" font-size="10" letter-spacing="3" fill="#5d6b7a">WORKFLOW · AP → CLOSE</text>
  <text x="96" y="90" class="syne" font-size="34" font-weight="800" fill="#0d1117">From inbox to closed books.</text>
  <text x="96" y="118" class="mono" font-size="13" fill="#5d6b7a">Six steps. One click. AI runs your month-end close.</text>

  <!-- Run Full Close button -->
  <g>
    <rect x="1174" y="46" width="202" height="48" rx="5" fill="#00C853" class="cta-glow"/>
    <rect x="1178" y="50" width="194" height="40" rx="4" fill="#00C853"/>
    <path d="M1200 62 v16 l14 -8 Z" fill="#000000"/>
    <text x="1224" y="75" class="syne" font-size="15" font-weight="700" fill="#000000">Run Full Close</text>
  </g>

  <!-- ============ CONNECTORS (behind nodes) ============ -->
  <!-- node centers x: 210,414,618,822,1026,1230 ; y 250 ; r 38 -->
  <g>
    <line class="conn" x1="252" y1="250" x2="372" y2="250"/>
    <line class="conn" x1="456" y1="250" x2="576" y2="250" style="animation-delay:.2s"/>
    <line class="conn" x1="660" y1="250" x2="780" y2="250" style="animation-delay:.4s"/>
    <line class="conn" x1="864" y1="250" x2="984" y2="250" style="animation-delay:.6s"/>
    <line class="conn" x1="1068" y1="250" x2="1188" y2="250" style="animation-delay:.8s"/>
    <!-- traveling "invoice" dots -->
    <circle r="4" class="dot"><animateMotion dur="2.4s" repeatCount="indefinite" path="M252 250 L372 250"/></circle>
    <circle r="4" class="dot"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" path="M456 250 L576 250"/></circle>
    <circle r="4" fill="#f5a623"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M660 250 L780 250"/></circle>
    <circle r="4" class="dot"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M864 250 L984 250"/></circle>
    <circle r="4" class="dot"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M1068 250 L1188 250"/></circle>
  </g>

  <!-- ============ STEP 1 · Invoices Arrive (trigger) ============ -->
  <g class="step" style="animation-delay:.05s">
    <circle cx="210" cy="250" r="38" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(210,250)">
      <path class="ln" d="M-14 2 v6 q0 3 3 3 h22 q3 0 3 -3 v-6 h-7 l-2 4 h-10 l-2 -4 Z"/>
      <path class="ln" d="M0 -12 v11 M-5 -6 l5 5 l5 -5"/>
    </g>
    <text x="210" y="316" text-anchor="middle" class="syne" font-size="14" font-weight="700" fill="#0d1117">Invoices Arrive</text>
    <!-- trigger card (dashed) -->
    <rect x="108" y="336" width="204" height="150" rx="4" fill="#ffffff" stroke="#c9d1da" stroke-width="1.4" stroke-dasharray="4 4"/>
    <text x="128" y="366" class="mono" font-size="9" letter-spacing="2" fill="#5d6b7a">SOURCES · TRIGGER</text>
    <text x="128" y="392" class="mono" font-size="11" fill="#0d1117">New invoice hits your</text>
    <text x="128" y="408" class="mono" font-size="11" fill="#0d1117">inbox or drive.</text>
    <g class="mono" font-size="10" fill="#3d4754">
      <rect x="128" y="424" width="52" height="22" rx="4" fill="#f4f6fb" stroke="#e0e0e0"/><text x="154" y="439" text-anchor="middle">Gmail</text>
      <rect x="186" y="424" width="48" height="22" rx="4" fill="#f4f6fb" stroke="#e0e0e0"/><text x="210" y="439" text-anchor="middle">Drive</text>
      <rect x="240" y="424" width="56" height="22" rx="4" fill="#f4f6fb" stroke="#e0e0e0"/><text x="268" y="439" text-anchor="middle">Outlook</text>
    </g>
    <text x="128" y="470" class="mono" font-size="10" fill="#5d6b7a">Auto-ingested · no upload</text>
  </g>

  <!-- ============ STEP 2 · Clen Extracts Data (Document Intelligence) ============ -->
  <g class="step" style="animation-delay:.2s">
    <circle cx="414" cy="250" r="38" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(414,250)">
      <path class="ln" d="M-9 -13 h11 l7 6 v20 h-18 Z"/>
      <path class="ln" d="M2 -13 v6 h5"/>
      <path class="lnm" d="M-5 -2 h11 M-5 3 h11 M-5 8 h7"/>
      <path d="M10 -10 l1.4 3 l3 1.4 l-3 1.4 l-1.4 3 l-1.4 -3 l-3 -1.4 l3 -1.4 Z" fill="#00C853"/>
    </g>
    <text x="414" y="316" text-anchor="middle" class="syne" font-size="14" font-weight="700" fill="#0d1117">Clen Extracts Data</text>
    <g class="card" style="animation-delay:.1s">
      <rect x="312" y="336" width="204" height="150" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.4"/>
      <rect x="312" y="336" width="3" height="150" fill="#00C853"/>
      <g transform="translate(332,360)"><path class="ln" d="M-6 -8 h8 l5 4 v14 h-13 Z"/><path class="lnm" d="M-3 0 h8 M-3 4 h8 M-3 8 h5"/></g>
      <text x="354" y="360" class="syne" font-size="14" font-weight="700" fill="#0d1117">Document</text>
      <text x="354" y="376" class="syne" font-size="14" font-weight="700" fill="#0d1117">Intelligence</text>
      <text x="332" y="404" class="mono" font-size="10.5" fill="#5d6b7a">Reads every PDF — vendor,</text>
      <text x="332" y="419" class="mono" font-size="10.5" fill="#5d6b7a">line items, totals, dates.</text>
      <rect x="332" y="446" width="52" height="20" rx="10" fill="#F0FBF4" stroke="#cdefd9"/>
      <circle cx="345" cy="456" r="3" fill="#00C853"/><text x="353" y="460" class="mono" font-size="9" fill="#00963c">Auto</text>
      <text x="496" y="460" text-anchor="end" class="mono" font-size="10" fill="#5d6b7a">Configure ▸</text>
    </g>
  </g>

  <!-- ============ STEP 3 · Matched & Coded (DocIntel + Tax Compliance) ============ -->
  <g class="step" style="animation-delay:.35s">
    <circle cx="618" cy="250" r="38" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(618,250)">
      <path class="ln" d="M-12 -6 h10 v10 h-10 Z M2 -2 h10 v10 h-10 Z"/>
      <circle cx="9" cy="9" r="6.5" fill="#ffffff" stroke="#00C853" stroke-width="1.6"/>
      <path d="M6 9 l2 2 l3.5 -4" fill="none" stroke="#00C853" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="618" y="308" text-anchor="middle" class="syne" font-size="14" font-weight="700" fill="#0d1117">Invoices Matched</text>
    <text x="618" y="325" text-anchor="middle" class="syne" font-size="14" font-weight="700" fill="#0d1117">&amp; Coded</text>
    <g class="card" style="animation-delay:.25s">
      <rect x="516" y="342" width="204" height="144" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.4"/>
      <rect x="516" y="342" width="3" height="144" fill="#00C853"/>
      <text x="536" y="368" class="mono" font-size="9" letter-spacing="2" fill="#5d6b7a">TWO TOOLS</text>
      <!-- row 1 -->
      <g transform="translate(536,384)"><path class="lnm" d="M-2 -8 h8 l4 3 v13 h-12 Z"/></g>
      <text x="558" y="391" class="syne" font-size="12.5" font-weight="700" fill="#0d1117">Document Intelligence</text>
      <text x="536" y="410" class="mono" font-size="10" fill="#5d6b7a">Matched to PO &amp; bill</text>
      <!-- row 2 -->
      <g transform="translate(536,432)"><path class="lnm" d="M-4 -6 l8 0 l0 8 l-4 4 l-4 -4 Z"/></g>
      <text x="558" y="437" class="syne" font-size="12.5" font-weight="700" fill="#0d1117">Tax Compliance</text>
      <text x="536" y="456" class="mono" font-size="10" fill="#5d6b7a">Coded to accounts &amp; VAT</text>
      <text x="704" y="476" text-anchor="end" class="mono" font-size="10" fill="#5d6b7a">Configure ▸</text>
    </g>
  </g>

  <!-- ============ STEP 4 · Approvals & Payment (Payment Runs — coming soon) ============ -->
  <g class="step" style="animation-delay:.5s">
    <circle cx="822" cy="250" r="38" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(822,250)" opacity="0.9">
      <rect class="lnm" x="-12" y="-9" width="24" height="20" rx="2"/>
      <path class="lnm" d="M-12 -3 h24 M-6 -13 v5 M6 -13 v5"/>
      <path class="lnm" d="M-4 5 h8"/>
    </g>
    <text x="822" y="308" text-anchor="middle" class="syne" font-size="14" font-weight="700" fill="#0d1117">Approvals &amp;</text>
    <text x="822" y="325" text-anchor="middle" class="syne" font-size="14" font-weight="700" fill="#0d1117">Payment Scheduled</text>
    <g class="card" style="animation-delay:.4s">
      <rect x="720" y="342" width="204" height="144" rx="4" fill="#fbfbfa" stroke="#ece7db" stroke-width="1.4"/>
      <g transform="translate(740,368)" opacity="0.85"><rect class="lnm" x="-6" y="-8" width="16" height="13" rx="1.5"/><path class="lnm" d="M-6 -4 h16"/></g>
      <text x="762" y="360" class="syne" font-size="14" font-weight="700" fill="#3d4754">Payment</text>
      <text x="762" y="376" class="syne" font-size="14" font-weight="700" fill="#3d4754">Runs</text>
      <text x="740" y="404" class="mono" font-size="10.5" fill="#8a94a0">Auto-schedules approved</text>
      <text x="740" y="419" class="mono" font-size="10.5" fill="#8a94a0">supplier payments.</text>
      <rect x="740" y="446" width="96" height="20" rx="10" fill="#FEF6E7" stroke="#f6e2b8"/>
      <circle cx="753" cy="456" r="3" fill="#f5a623"/><text x="761" y="460" class="mono" font-size="9" fill="#b9791a">Coming soon</text>
      <text x="904" y="460" text-anchor="end" class="mono" font-size="10" fill="#b6bcc4">Notify me ▸</text>
    </g>
  </g>

  <!-- ============ STEP 5 · Bank Rec Complete (Reconciliation) ============ -->
  <g class="step" style="animation-delay:.65s">
    <circle cx="1026" cy="250" r="38" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    <g transform="translate(1026,250)">
      <path class="ln" d="M-13 -2 L0 -12 L13 -2 Z"/>
      <path class="ln" d="M-13 11 h26"/>
      <path class="lnm" d="M-9 -1 v9 M-3 -1 v9 M3 -1 v9 M9 -1 v9"/>
    </g>
    <text x="1026" y="316" text-anchor="middle" class="syne" font-size="14" font-weight="700" fill="#0d1117">Bank Rec Complete</text>
    <g class="card" style="animation-delay:.55s">
      <rect x="924" y="336" width="204" height="150" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.4"/>
      <rect x="924" y="336" width="3" height="150" fill="#00C853"/>
      <g transform="translate(944,362)"><path class="ln" d="M-8 -1 L0 -8 L8 -1 Z"/><path class="lnm" d="M-8 7 h16"/></g>
      <text x="966" y="360" class="syne" font-size="14" font-weight="700" fill="#0d1117">Reconciliation</text>
      <text x="944" y="392" class="mono" font-size="10.5" fill="#5d6b7a">Matches every bank txn to</text>
      <text x="944" y="407" class="mono" font-size="10.5" fill="#5d6b7a">invoices &amp; bills. Flags rest.</text>
      <text x="944" y="429" class="mono" font-size="10.5" fill="#5d6b7a">Bank · VAT · payroll.</text>
      <rect x="944" y="446" width="52" height="20" rx="10" fill="#F0FBF4" stroke="#cdefd9"/>
      <circle cx="957" cy="456" r="3" fill="#00C853"/><text x="965" y="460" class="mono" font-size="9" fill="#00963c">Auto</text>
      <text x="1108" y="460" text-anchor="end" class="mono" font-size="10" fill="#5d6b7a">Configure ▸</text>
    </g>
  </g>

  <!-- ============ STEP 6 · Books Closed (Financial Reporting) ============ -->
  <g class="step" style="animation-delay:.8s">
    <circle cx="1230" cy="250" r="38" fill="#ffffff" stroke="#00C853" stroke-width="1.6"/>
    <g transform="translate(1230,250)">
      <path class="ln" d="M-11 -12 h13 q4 0 4 4 v20 h-17 Z"/>
      <path class="lnm" d="M-11 -12 v24"/>
      <path d="M-3 0 l2.5 3 l5 -6" fill="none" stroke="#00C853" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1230" y="316" text-anchor="middle" class="syne" font-size="14" font-weight="700" fill="#0d1117">Books Closed</text>
    <g class="card" style="animation-delay:.7s">
      <rect x="1128" y="336" width="204" height="150" rx="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.4"/>
      <rect x="1128" y="336" width="3" height="150" fill="#00C853"/>
      <g transform="translate(1148,362)"><path class="lnm" d="M-8 7 v-6 M-3 7 v-11 M2 7 v-4 M7 7 v-9"/><path class="lnm" d="M-9 9 h18"/></g>
      <text x="1170" y="360" class="syne" font-size="14" font-weight="700" fill="#0d1117">Financial</text>
      <text x="1170" y="376" class="syne" font-size="14" font-weight="700" fill="#0d1117">Reporting</text>
      <text x="1148" y="404" class="mono" font-size="10.5" fill="#5d6b7a">P&amp;L, balance sheet &amp; cash</text>
      <text x="1148" y="419" class="mono" font-size="10.5" fill="#5d6b7a">flow. AI narrative + flags.</text>
      <rect x="1148" y="446" width="52" height="20" rx="10" fill="#F0FBF4" stroke="#cdefd9"/>
      <circle cx="1161" cy="456" r="3" fill="#00C853"/><text x="1169" y="460" class="mono" font-size="9" fill="#00963c">Auto</text>
      <text x="1312" y="460" text-anchor="end" class="mono" font-size="10" fill="#5d6b7a">Configure ▸</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(96,600)" class="mono" font-size="11" fill="#5d6b7a">
    <circle cx="6" cy="-4" r="4" fill="#00C853"/><text x="18" y="0">Auto — runs without approval</text>
    <circle cx="266" cy="-4" r="4" fill="#00a8cc"/><text x="278" y="0">Needs approval</text>
    <circle cx="452" cy="-4" r="4" fill="#f5a623"/><text x="464" y="0">Coming soon</text>
    <text x="640" y="0" fill="#8a94a0">Tap any card to configure the step.</text>
  </g>
</svg>
